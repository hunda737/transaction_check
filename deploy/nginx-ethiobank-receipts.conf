# /etc/nginx/sites-available/ethiobank-receipts
server {
    listen 80;
    server_name receipts.internal.example.com;   # <-- change

    # After certbot, this becomes a 301 to https and the block below serves TLS.
    location / {
        proxy_pass http://127.0.0.1:8060;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A bank host can take ~30s to answer; the service's own read timeout is
        # 30s by default, so nginx must wait longer than that or it will 504
        # before the service can return a clean 502.
        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Don't expose interactive docs publicly.
    location ~ ^/(docs|redoc|openapi.json) {
        allow 127.0.0.1;
        allow 10.0.0.0/8;      # <-- your internal range
        deny all;
        proxy_pass http://127.0.0.1:8060;
    }
}
